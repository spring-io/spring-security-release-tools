name: 'Update Bot'
description: "Reads .github/dependabot.yml's github-actions entries and, for each target branch, opens a pull request bumping the spring-security-release-plugin version and the pinned spring-security-release-tools workflow/action SHAs to the latest release"
author: 'spring-projects'

branding:
  icon: 'arrow-up-circle'
  color: 'green'

inputs:
  token:
    description: 'GitHub token used to push the update branch and open/update the pull request. Needs contents:write and pull-requests:write.'
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/index.js
