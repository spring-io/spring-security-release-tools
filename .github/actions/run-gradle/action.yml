name: 'Run Gradle'
description: 'Run a Gradle command with optional init script, repository credentials, and artifact upload.'
author: 'Spring'

inputs:
  java-version:
    description: Version of the JDK to use to run the Gradle command.
    required: false
    default: '17'
  distribution:
    description: Distribution of the JDK to use to run the Gradle command.
    required: false
    default: 'temurin'
  gradle-args:
    description: Arguments to pass to the Gradle command.
    required: false
    default: 'clean build --continue'
  upload-artifacts:
    description: Whether to publish artifacts to a local repository and upload them for later deployment.
    required: false
    default: 'false'
  init-script:
    description: Name of the Gradle init script to apply (without .gradle extension). Valid values are spring-enterprise, spring-oss, or empty.
    required: false
    default: ''
  artifactory-username:
    description: Username for the Artifactory repository referenced by the init script.
    required: false
    default: ''
  artifactory-password:
    description: Password for the Artifactory repository referenced by the init script.
    required: false
    default: ''
  develocity-access-key:
    description: Develocity access key for OSS builds.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: spring-io/spring-gradle-build-action@c8668747d7c264864c8c7f7026d0d277d14a78dc # v2.0.6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
    - id: gradle-args
      name: Compute Gradle Arguments
      shell: bash
      env:
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        UPLOAD_ARTIFACTS: ${{ inputs.upload-artifacts }}
      run: |
        args="$GRADLE_ARGS"
        if [[ "$UPLOAD_ARTIFACTS" == "true" ]] ; then
          args="$args publishAllPublicationsToLocalRepository"
        fi
        echo "value=$args" >> $GITHUB_OUTPUT
    - name: Set up Init Script
      if: ${{ inputs.init-script != '' }}
      shell: bash
      env:
        INIT_SCRIPT: ${{ inputs.init-script }}
        ARTIFACTORY_USERNAME: ${{ inputs.artifactory-username }}
        ARTIFACTORY_PASSWORD: ${{ inputs.artifactory-password }}
      run: |
        if [[ ! -f "$GITHUB_ACTION_PATH/$INIT_SCRIPT.gradle" ]] ; then
          echo "::error::Unknown init-script '$INIT_SCRIPT'"
          exit 1
        fi
        if [[ -z "$ARTIFACTORY_USERNAME" || -z "$ARTIFACTORY_PASSWORD" ]] ; then
          echo "::error::init-script '$INIT_SCRIPT' requires both artifactory-username and artifactory-password"
          exit 1
        fi
        mkdir -p "$HOME/.gradle/init.d"
        cp "$GITHUB_ACTION_PATH/$INIT_SCRIPT.gradle" "$HOME/.gradle/init.d/$INIT_SCRIPT.gradle"
    - name: Build with Gradle
      shell: bash
      env:
        ARTIFACTORY_USERNAME: ${{ inputs.artifactory-username }}
        ARTIFACTORY_PASSWORD: ${{ inputs.artifactory-password }}
        DEVELOCITY_ACCESS_KEY: ${{ inputs.develocity-access-key }}
        GRADLE_ARGS: ${{ steps.gradle-args.outputs.value }}
      run: ./gradlew $GRADLE_ARGS
    - name: Upload Local Maven Repository
      if: ${{ inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: local-maven-repository
        path: build/publications/repos
        retention-days: 1
    - name: Remove Init Script
      if: always()
      shell: bash
      env:
        INIT_SCRIPT: ${{ inputs.init-script }}
      run: |
        if [[ -n "$INIT_SCRIPT" ]] ; then
          rm -f "$HOME/.gradle/init.d/$INIT_SCRIPT.gradle"
        fi
