name: 'Run Gradle'
description: 'Run a Gradle command, optionally with Spring Enterprise repository configuration and artifact upload.'
author: 'Spring'

inputs:
  java-version:
    description: Version of the JDK to use to run the Gradle command.
    required: false
    default: '17'
  distribution:
    description: Distribution of the JDK to use to run the Gradle command.
    required: false
    default: 'temurin'
  gradle-args:
    description: Arguments to pass to the Gradle command.
    required: false
    default: 'clean build --continue'
  upload-artifacts:
    description: Whether to publish artifacts to a local repository and upload them for later deployment.
    required: false
    default: 'false'
  artifactory-username:
    description: Artifactory username. When provided alongside artifactory-password, configures the Spring Enterprise Maven repository.
    required: false
    default: ''
  artifactory-password:
    description: Artifactory password. When provided, configures the Spring Enterprise Maven repository.
    required: false
    default: ''
  develocity-access-key:
    description: Develocity access key. Used for OSS builds when Artifactory credentials are not provided.
    required: false
    default: ''

outputs:
  should-deploy-artifacts:
    description: Whether artifacts should be deployed. Only meaningful when upload-artifacts is true.
    value: ${{ steps.should-deploy-artifacts.outputs.result }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: spring-io/spring-gradle-build-action@c8668747d7c264864c8c7f7026d0d277d14a78dc # v2.0.6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
    - id: gradle-args
      name: Compute Gradle Arguments
      shell: bash
      env:
        GRADLE_ARGS: ${{ inputs.gradle-args }}
        UPLOAD_ARTIFACTS: ${{ inputs.upload-artifacts }}
      run: |
        args="$GRADLE_ARGS"
        if [[ "$UPLOAD_ARTIFACTS" == "true" ]] ; then
          args="$args publishAllPublicationsToLocalRepository"
        fi
        echo "value=$args" >> $GITHUB_OUTPUT
    - name: Build with Gradle
      if: ${{ inputs.artifactory-password != '' }}
      shell: bash
      env:
        ARTIFACTORY_USERNAME: ${{ inputs.artifactory-username }}
        ARTIFACTORY_PASSWORD: ${{ inputs.artifactory-password }}
        GRADLE_ARGS: ${{ steps.gradle-args.outputs.value }}
      run: |
        mkdir -p "$HOME/.gradle/init.d"
        cat > "$HOME/.gradle/init.d/spring-enterprise.gradle" <<'EOF'
        allprojects { project ->
          project.repositories {
            maven {
              name = 'spring-enterprise-dev'
              url = 'https://usw1.packages.broadcom.com/spring-enterprise-maven-dev-local'
              credentials {
                username = System.getenv("ARTIFACTORY_USERNAME")
                password = System.getenv("ARTIFACTORY_PASSWORD")
              }
            }
          }
        }
        EOF
        ./gradlew $GRADLE_ARGS
    - name: Build with Gradle
      if: ${{ inputs.artifactory-password == '' }}
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.develocity-access-key }}
        GRADLE_ARGS: ${{ steps.gradle-args.outputs.value }}
      run: ./gradlew $GRADLE_ARGS
    - name: Upload Local Maven Repository
      if: ${{ inputs.upload-artifacts == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: local-maven-repository
        path: build/publications/repos
    - id: should-deploy-artifacts
      name: Check Deploy Artifacts
      if: ${{ inputs.upload-artifacts == 'true' && runner.os == 'Linux' }}
      shell: bash
      env:
        ARTIFACTORY_PASSWORD: ${{ inputs.artifactory-password }}
      run: |
        if [[ -n "$ARTIFACTORY_PASSWORD" ]] ; then
          echo "result=true" >> $GITHUB_OUTPUT
        else
          echo "result=false" >> $GITHUB_OUTPUT
        fi
    - name: Remove Spring Enterprise Init Script
      if: always()
      shell: bash
      run: rm -f "$HOME/.gradle/init.d/spring-enterprise.gradle"
