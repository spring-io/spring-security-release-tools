# DEPRECATED: This action is deprecated in favor of spring-io/github-actions/update-dependabot.
name: 'Generate Dependabot YML'
description: 'DEPRECATED: Use spring-io/github-actions/update-dependabot instead. Generates a dependabot.yml from a template file.'
author: 'Your name or organization here'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'heart'
  color: 'red'

# Define your inputs here.
inputs:
  gradle-branches:
    description: 'The branches for gradle package-ecosystem'
    required: false
  github-actions-branches:
    description: 'The branches for github-actions package-ecosystem'
    required: false
  template-file:
    description: 'The file used as template'
    required: false
    default: '.github/dependabot.template.yml'
  gh-token:
    description: 'GitHub Token'
    required: true

runs:
  using: node20
  main: dist/index.js
