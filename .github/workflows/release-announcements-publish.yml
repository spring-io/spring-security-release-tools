name: Shared - Release Announcements - Publish

on:
  workflow_call:
    inputs:
      version:
        description: The release to publish
        required: true
        type: string
    secrets:
      SPRING_RELEASE_GCHAT_WEBHOOK_URL:
        required: true

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  check-support-window:
    name: Check Support Window
    runs-on: ubuntu-latest
    steps:
      - id: support-window
        name: Compute Support Window
        uses: spring-io/spring-release-actions/compute-support-window@3f7412aeec60ad13127b2a536a1b19a2803a5b81  # 0.0.8
        with:
          version: ${{ inputs.version }}
      - name: Cancel if Repository Doesn't Match Support Window
        if: steps.support-window.outputs.repository-matches-support-window == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "::warning::Cancelling release announcements for $VERSION — $GITHUB_REPOSITORY does not match its support window."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
  compute-release:
    name: Compute Release Coordinates
    needs: [ check-support-window ]
    runs-on: ubuntu-latest
    outputs:
      next-milestone-version: ${{ steps.next-release-milestone.outputs.version }}
      next-milestone-version-date: ${{ steps.next-release-milestone.outputs.version-date }}
      next-milestone-version-type: ${{ steps.next-release-milestone.outputs.version-type }}
    steps:
      - id: next-release-milestone
        name: Get Next Release Milestone
        uses: spring-io/spring-release-actions/compute-next-version@3f7412aeec60ad13127b2a536a1b19a2803a5b81  # 0.0.8
        with:
          version: ${{ inputs.version }}
          token: ${{ github.token }}
  deploy-docs:
    name: Deploy Docs
    needs: [ check-support-window ]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Docs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy-docs.yml -r docs-build
  update-milestones:
    name: Update Milestones
    needs: [ compute-release, deploy-docs ]
    runs-on: ubuntu-latest
    steps:
      - name: Close Milestone
        uses: spring-io/spring-release-actions/close-milestone@3f7412aeec60ad13127b2a536a1b19a2803a5b81  # 0.0.8
        with:
          version: ${{ inputs.version }}
          token: ${{ github.token }}
      - name: Schedule Next Release (if not already scheduled)
        uses: spring-io/spring-release-actions/schedule-milestone@3f7412aeec60ad13127b2a536a1b19a2803a5b81  # 0.0.8
        with:
          version: ${{ needs.compute-release.outputs.next-milestone-version }}
          version-type: ${{ needs.compute-release.outputs.next-milestone-version-type }}
          token: ${{ github.token }}
  announce:
    name: Announce Release
    needs: [ update-milestones ]
    runs-on: ubuntu-latest
    steps:
      - name: Announce Release on GChat
        uses: spring-io/spring-release-actions/announce-on-gchat@3f7412aeec60ad13127b2a536a1b19a2803a5b81  # 0.0.8
        with:
          version: ${{ inputs.version }}
          gchat-webhook-url: ${{ secrets.SPRING_RELEASE_GCHAT_WEBHOOK_URL }}
