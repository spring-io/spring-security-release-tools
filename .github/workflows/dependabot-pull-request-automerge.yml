name: Local - Dependabot - Auto-merge PR

on:
  pull_request:
    branches:
      - main
      - '*.x'
      - 'docs-build'

run-name: Merge Dependabot PR ${{ github.ref_name }}

jobs:
  merge-dependabot-pr:
    permissions: write-all
    uses: spring-io/spring-github-workflows/.github/workflows/spring-merge-dependabot-pr.yml@1323610691f6e35ff3eec0ece3655f3c03af84c9 # main
    with:
      mergeArguments: --auto --rebase
