name: Local - Dependabot - Auto-merge PR

on:
  pull_request:
    branches:
      - main
      - '*.x'
      - 'docs-build'

run-name: Merge Dependabot PR ${{ github.ref_name }}

jobs:
  merge-dependabot-pr:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: spring-io/spring-github-workflows/.github/workflows/spring-merge-dependabot-pr.yml@6268388bc4b4aa6d3dd58e86e84ab2a1cc21e909 # main
    with:
      mergeArguments: --auto --rebase
