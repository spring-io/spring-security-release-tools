name: Local - Dependabot - Auto-merge PR

on:
  pull_request:
    branches:
      - main
      - '*.x'
      - 'docs-build'

run-name: Merge Dependabot PR ${{ github.ref_name }}

jobs:
  merge-dependabot-pr:
    permissions: write-all
    uses: spring-io/spring-github-workflows/.github/workflows/spring-merge-dependabot-pr.yml@896de9b7a28853dc180d2c4adb575c82cdb39ab1 # main
    with:
      mergeArguments: --auto --rebase
