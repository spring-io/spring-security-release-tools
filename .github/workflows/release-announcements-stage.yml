name: Stage Release Announcements

on:
  workflow_call:
    inputs:
      version:
        description: The project version to stage
        required: true
        type: string
      branch:
        description: The branch to release from. Defaults to deriving it from version (e.g. 1.2.3 -> 1.2.x).
        required: false
        type: string
    secrets:
      GH_ACTIONS_REPO_TOKEN:
        required: true

permissions:
  actions: write
  contents: read

jobs:
  check-support-window:
    name: Check Support Window
    runs-on: ubuntu-latest
    steps:
      - id: support-window
        name: Compute Support Window
        uses: spring-io/spring-release-actions/compute-support-window@fbfbd143f47bf73be69883a5a7c9cd1f826022fe  # 0.0.6
        with:
          version: ${{ inputs.version }}
      - name: Cancel if Repository Doesn't Match Support Window
        if: steps.support-window.outputs.repository-matches-support-window == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "::warning::Cancelling release announcements for $VERSION — $GITHUB_REPOSITORY does not match its support window."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
  stage-release-announcements:
    name: Stage Release Announcements
    needs: [ check-support-window ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
      - id: branch-name
        name: Extract Branch Name
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
        run: echo "branch=${BRANCH:-${VERSION%.*}.x}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        env:
          TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN }}
          BRANCH: ${{ steps.branch-name.outputs.branch }}
          VERSION: ${{ inputs.version }}
        run: ./gradlew createGitHubRelease -PnextVersion=$VERSION -Pbranch=$BRANCH -PcreateRelease=true -PgitHubAccessToken=$TOKEN
