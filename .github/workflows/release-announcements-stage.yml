name: Shared - Release Announcements - Stage

on:
  workflow_dispatch:
    inputs:
      version:
        description: The project version to stage
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: The project version to stage
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

jobs:
  check-support-window:
    name: Check Support Window
    runs-on: ubuntu-latest
    steps:
      - id: support-window
        name: Compute Support Window
        uses: spring-io/spring-release-actions/compute-support-window@3f7412aeec60ad13127b2a536a1b19a2803a5b81  # 0.0.8
        with:
          version: ${{ inputs.version }}
      - name: Cancel if Repository Doesn't Match Support Window
        if: steps.support-window.outputs.repository-matches-support-window == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "::warning::Cancelling release announcements for $VERSION — $GITHUB_REPOSITORY does not match its support window."
          gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
  stage-release-announcements:
    name: Stage Release Announcements
    needs: [ check-support-window ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
      - name: Publish Release Notes
        uses: spring-io/spring-security-actions/publish-release-notes@f7eb724f5fbf957902119e177c8aa13bd36881a2 # 0.0.9
        with:
          tag: ${{ inputs.version }}
