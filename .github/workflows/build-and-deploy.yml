name: CI

on:
  push:
    branches:
      - 'main'
      - '*.x'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    secrets: inherit
  actions:
    name: Action (${{ matrix.path }})
    strategy:
      fail-fast: false
      matrix:
        path: [ update-bot, auto-merge-forward ]
    uses: ./.github/workflows/_action-dist.yml
    with:
      path: ${{ matrix.path }}
  deploy-artifacts:
    name: Deploy Artifacts
    needs: [ build, test, actions ]
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/deploy-artifacts.yml
    with:
      should-deploy-artifacts: ${{ needs.build.outputs.should-deploy-artifacts }}
    secrets: inherit
  publish-plugins:
    name: Publish Plugins
    needs: [ deploy-artifacts ]
    uses: ./.github/workflows/publish-plugins.yml
    with:
      should-publish-plugins: ${{ needs.deploy-artifacts.outputs.artifacts-deployed }}
      project-version: ${{ needs.deploy-artifacts.outputs.project-version }}
    secrets: inherit
  send-notification:
    name: Send Notification
    needs: [ publish-plugins ]
    if: ${{ (failure() || cancelled()) && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        uses: spring-io/spring-security-release-tools/.github/actions/send-notification@6803d775925cdca5990e1e68b5a1c1fe38fa3947 # v1.0.20
        with:
          webhook-url: ${{ secrets.SPRING_SECURITY_CI_GCHAT_WEBHOOK_URL }}
