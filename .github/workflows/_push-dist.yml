# Commits the dist/ directories rebuilt by _action-dist.yml (via build-and-deploy.yml)
# onto the Dependabot pull request branch that triggered them. Dependabot can bump
# an action's npm dependencies, but it can't rebuild the checked-in dist/ that
# consumers actually run.
#
# Private: the leading underscore marks this as internal to this repository.
#
# This is the only privileged piece. It never runs the PR's code: it only copies
# artifact contents into the dist/ of the action named by the PR's branch.
name: Push dist

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: read

jobs:
  push:
    name: Commit dist/
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Dependabot names its branches dependabot/npm_and_yarn/<directory>/<dependency>-<version>,
      # and <directory> is the action. Starts from the PR head's tree, swaps in the
      # built dist/, and commits that on top of the PR head without touching the
      # working tree.
      - name: Commit dist/ if changed
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          rest="${HEAD_REF#dependabot/npm_and_yarn/}"
          ACTION_DIR="${rest%%/*}"
          [ -f "$ACTION_DIR/action.yml" ] || { echo "::error::$ACTION_DIR is not an action directory"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          export GIT_INDEX_FILE="$RUNNER_TEMP/index"
          git read-tree "$HEAD_SHA"
          rm -rf "$ACTION_DIR/dist"
          cp -R "$RUNNER_TEMP/dist" "$ACTION_DIR/dist"
          git rm -r -q --cached --ignore-unmatch "$ACTION_DIR/dist"
          git add -f "$ACTION_DIR/dist"
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            echo "dist/ is already up to date."
            exit 0
          fi
          commit=$(git commit-tree "$tree" -p "$HEAD_SHA" -m "Update dist/")
          git push origin "$commit:refs/heads/$HEAD_REF"
