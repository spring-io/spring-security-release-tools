# Commits the dist/ built by update-bot-pr.yml onto the Dependabot pull request
# branch that triggered it.
name: Pull Request - Push Update Bot dist

on:
  workflow_run:
    workflows: ['Pull Request - Update Bot']
    types:
      - completed

permissions:
  contents: read

jobs:
  push:
    name: Commit dist/
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Replace dist/
        run: rm -rf update-bot/dist

      - name: Download dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: update-bot/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Starts from the PR head's tree, swaps in the built dist/, and commits
      # that on top of the PR head without touching the working tree.
      - name: Commit dist/ if changed
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          export GIT_INDEX_FILE="$RUNNER_TEMP/index"
          git read-tree "$HEAD_SHA"
          git rm -r -q --cached --ignore-unmatch update-bot/dist
          git add -f update-bot/dist
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse "$HEAD_SHA^{tree}")" ]; then
            echo "dist/ is already up to date."
            exit 0
          fi
          commit=$(git commit-tree "$tree" -p "$HEAD_SHA" -m "Update update-bot dist/")
          git push origin "$commit:refs/heads/$HEAD_REF"
