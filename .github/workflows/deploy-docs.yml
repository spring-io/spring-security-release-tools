name: Shared - Deploy Docs

on:
  workflow_call:
    inputs:
      java-version:
        description: The JDK version to use
        required: false
        default: '17'
        type: string
      should-deploy-docs:
        description: Whether docs should be deployed.
        required: true
        type: string
    outputs:
      docs-deployed:
        description: Whether docs were actually deployed.
        value: ${{ jobs.deploy-docs.outputs.docs-deployed }}
    secrets:
      DEVELOCITY_ACCESS_KEY:
        required: false
      DOCS_USERNAME:
        required: false
      DOCS_SSH_KEY:
        required: false
      DOCS_HOST:
        required: false

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  DOCS_USERNAME: ${{ secrets.DOCS_USERNAME }}
  DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
  DOCS_HOST: ${{ secrets.DOCS_HOST }}

jobs:
  deploy-docs:
    name: Deploy Docs
    if: ${{ inputs.should-deploy-docs == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      docs-deployed: ${{ steps.docs-deployed.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK ${{ inputs.java-version }}
        uses: spring-io/spring-gradle-build-action@99a2aa4bd02e3a216fdbc574e256ec860f791d4c # v2.0.7
        with:
          java-version: ${{ inputs.java-version }}
      - name: Get IP
        run: curl https://api.ipify.org
      - name: Deploy Docs
        run: ./gradlew deployDocs -PdeployDocsSshKey="$DOCS_SSH_KEY" -PdeployDocsSshUsername="$DOCS_USERNAME" -PdeployDocsHost="$DOCS_HOST" --stacktrace
      - id: docs-deployed
        name: Docs Deployed
        run: echo "result=true" >> $GITHUB_OUTPUT
