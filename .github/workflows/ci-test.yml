name: Shared - CI - Test

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to test with
        type: string
        default: '25'
      runner:
        description: Runner to test on
        type: string
        default: ubuntu-latest
      release-channel:
        description: The release channel; oss or internal
        type: string
        default: oss        
    secrets:
      artifactory-username:
        description: Username for resolving dependencies, if the release channel requires one
        required: false
      artifactory-password:
        description: Password for resolving dependencies, if the release channel requires one
        required: false

jobs:
  test:
    name: Test Against Snapshots
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Project
        uses: spring-io/spring-security-actions/test@c8314b8f185f899b0fe7ccf07d64c7d25c4f21de # 0.0.34
        env:
          ORG_GRADLE_PROJECT_releaseChannel: ${{ inputs.release-channel }}
          ORG_GRADLE_PROJECT_artifactoryUsername: ${{ secrets.artifactory-username }}
          ORG_GRADLE_PROJECT_artifactoryPassword: ${{ secrets.artifactory-password }}
        with:
          java-version: ${{ inputs.java-version }}
          gradle-args: -Psnapshot -PtestToolchain=${{ inputs.java-version }}
