name: Shared - CI - Deploy Artifacts

on:
  workflow_call:
    inputs:
      runner:
        description: Runner to deploy on
        type: string
        default: ubuntu-latest
      version:
        description: Version being deployed
        type: string
        required: true
    secrets:
      artifactory-username:
        description: Username for publishing artifacts
        required: true
      artifactory-password:
        description: Password for publishing artifacts
        required: true

jobs:
  deploy-artifacts:
    name: Deploy Artifacts
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Local Repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-repository
          path: build/publications/repos
      - id: artifact-repository
        name: Compute Artifact Repository
        uses: spring-io/spring-release-actions/compute-artifact-repository@967a8de4659c4273a82bcb098d73c2330c015254 # 0.0.9
        with:
          version: ${{ inputs.version }}
      - name: Deploy Artifacts
        uses: spring-io/spring-security-actions/ensure-artifacts@684ca83d1b00d67326499eb02e6517d4f5bd73d1 # 0.0.32
        with:
          version: ${{ inputs.version }}
          username: ${{ secrets.artifactory-username }}
          password: ${{ secrets.artifactory-password }}
          repository-uri: ${{ steps.artifact-repository.outputs.uri }}
          repository-name: ${{ steps.artifact-repository.outputs.name }}
          project: ${{ steps.artifact-repository.outputs.project }}
          local-repository: build/publications/repos
          artifact-path: org/springframework/ldap/spring-ldap-core
