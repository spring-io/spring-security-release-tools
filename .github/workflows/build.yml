name: Build
permissions: {}
on:
  workflow_call:
    inputs:
      java-version:
        description: Version of the JDK to use to run the Gradle command.
        required: false
        default: '17'
        type: string
      distribution:
        description: Distribution of the JDK to use to run the Gradle command.
        required: false
        default: 'temurin'
        type: string
      runs-on:
        description: GitHub Actions runner to run the build task on.
        required: false
        default: 'ubuntu-latest'
        type: string
      ref:
        description: The branch or tag to checkout
        required: false
        default: ${{ github.ref }}
        type: string
    outputs:
      should-deploy-artifacts:
        description: Whether artifacts should be deployed.
        value: ${{ jobs.build.outputs.should-deploy-artifacts }}
    secrets:
      ARTIFACTORY_USERNAME:
        required: false
      ARTIFACTORY_PASSWORD:
        required: false
      DEVELOCITY_ACCESS_KEY:
        required: false

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      should-deploy-artifacts: ${{ steps.run-gradle.outputs.should-deploy-artifacts }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: spring-io/spring-security-release-tools
          ref: ${{ github.action_ref }}
          path: _srt
          fetch-depth: 1
      - id: run-gradle
        name: Build ${{ inputs.ref }} with Gradle
        uses: ./_srt/.github/actions/run-gradle
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          gradle-args: build --continue
          upload-artifacts: 'true'
          artifactory-username: ${{ secrets.ARTIFACTORY_USERNAME }}
          artifactory-password: ${{ secrets.ARTIFACTORY_PASSWORD }}
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
