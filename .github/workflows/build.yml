name: Build
permissions: {}
on:
  workflow_call:
    inputs:
      java-version:
        description: Version of the JDK to use to run the Gradle command.
        required: false
        default: '17'
        type: string
      distribution:
        description: Distribution of the JDK to use to run the Gradle command.
        required: false
        default: 'temurin'
        type: string
      runs-on:
        description: GitHub Actions runner to run the build task on.
        required: false
        default: 'ubuntu-latest'
        type: string
      ref:
        description: The branch or tag to checkout
        required: false
        default: ${{ github.ref }}
        type: string
      upload-artifacts:
        description: Whether this run should upload the local Maven repository for later deployment. Set to true on exactly one matrix entry when build.yml is matrixed.
        required: false
        default: true
        type: boolean
    outputs:
      should-deploy-artifacts:
        description: Whether artifacts should be deployed.
        value: ${{ jobs.build.outputs.should-deploy-artifacts }}
    secrets:
      COMMERCIAL_ARTIFACTORY_USERNAME:
        required: false
      COMMERCIAL_ARTIFACTORY_PASSWORD:
        required: false
      DEVELOCITY_ACCESS_KEY:
        required: false

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      should-deploy-artifacts: ${{ steps.should-deploy-artifacts.outputs.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: spring-io/spring-security-release-tools
          ref: ${{ github.action_ref }}
          path: _srt
          fetch-depth: 1
      - if: ${{ vars.COMMERCIAL == 'true' }}
        uses: ./_srt/.github/actions/update-commercial-licensing
      - id: should-deploy-artifacts
        name: Mark as Canonical for Deploy
        if: ${{ inputs.upload-artifacts }}
        shell: bash
        run: echo "result=true" >> $GITHUB_OUTPUT
      - name: Build ${{ inputs.ref }} with Gradle
        uses: ./_srt/.github/actions/run-gradle
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.distribution }}
          upload-artifacts: ${{ inputs.upload-artifacts }}
          init-script: ${{ vars.COMMERCIAL == 'true' && 'spring-enterprise' || '' }}
          artifactory-username: ${{ vars.COMMERCIAL == 'true' && secrets.COMMERCIAL_ARTIFACTORY_USERNAME || '' }}
          artifactory-password: ${{ vars.COMMERCIAL == 'true' && secrets.COMMERCIAL_ARTIFACTORY_PASSWORD || '' }}
          develocity-access-key: ${{ vars.COMMERCIAL != 'true' && secrets.DEVELOCITY_ACCESS_KEY || '' }}
