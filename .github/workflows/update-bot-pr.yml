# Dependabot can bump update-bot's npm dependencies, but it can't rebuild the
# checked-in update-bot/dist/index.js that consumers actually run. This workflow
# tests and rebuilds update-bot for Dependabot pull requests that touch
# update-bot/ and uploads the rebuilt dist/ as an artifact.
#
# It is unprivileged on purpose: it runs the PR's code, so it has no write access.
# update-bot-push-dist.yml (triggered by this workflow's completion) is what
# commits the artifact back onto the PR branch.
name: Pull Request - Update Bot

on:
  pull_request:
    paths:
      - 'update-bot/**'

permissions:
  contents: read

jobs:
  build:
    name: Test and Build dist/
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: update-bot

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: update-bot/.node-version
          cache: npm
          cache-dependency-path: update-bot/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Build dist/
        run: npm run bundle

      - name: Upload dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: update-bot/dist
          if-no-files-found: error
