name: CI - Update Bot

on:
  push:
    branches-ignore:
      - 'dependabot/**' # update-bot-pr.yml rebuilds dist/ for these

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, and Check dist/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: update-bot

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: update-bot/.node-version
          cache: npm
          cache-dependency-path: update-bot/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test

      - name: Build dist/
        run: npm run bundle

      - name: Check for uncommitted build output
        run: |
          if [ -n "$(git status --porcelain .)" ]; then
            echo "Build produced changes not present in the branch. Run 'npm run bundle' in update-bot/ and commit the result:"
            git status --porcelain .
            git diff --ignore-space-at-eol --text .
            exit 1
          fi

      - if: ${{ failure() }}
        name: Upload dist/ for inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: update-bot/dist
