name: "Release - Publish Release Notes"

permissions:
  contents: write
  issues: write
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The milestone/tag to generate and publish release notes for (for example, 6.3.1)"
        required: true

jobs:
  publish-release-notes:
    name: "Publish Release Notes"
    runs-on: ubuntu-latest
    uses: spring-io/spring-security-actions/publish-release-notes@7b123d42b18f8e52c1925c5eecc3e217bfe3b31b # 0.0.2
    with:
      tag: ${{ inputs.version }}
